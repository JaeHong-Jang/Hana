risks:
  - id: "R-001"
    status: "open"
    risk: "여럿이 준비한 내용을 1인 명의로 내도 되는지 요강에 없다."
    control: "11/25 주최 측에 문의하고 답변을 06_증빙에 보관한다."
  - id: "R-002"
    status: "open"
    risk: "모든 후보 순위가 하나증권V 앱 내부를 열어 보지 않은 상태에서 매겨졌다. 제안하려는 기능이 이미 있을 수 있다."
    control: "11/25 앱을 직접 열어 확인하고 캡처를 남긴다. 결과에 따라 후보를 바꾼다."
  - id: "R-003"
    status: "open"
    risk: "후보 가는 인증 관련 저평점이 18건 안팎으로 적고, 회사가 이미 고치는 중일 수 있으며, 기존 상담 창구(콜백, 방문/전화 예약, 바로연결)가 로그인 못 하는 손님에게 맞지 않아 새로 만드는 제안이 된다."
    control: "리뷰를 직접 다시 세고, 문제를 '앱이 풀 수 없는 일을 사람에게 넘기는 경로'로 세운다."
  - id: "R-004"
    status: "open"
    risk: "수치가 요약 도구를 거쳐 확인됐고, 집계 기준이 다른 수치가 섞여 있다(금감원 대 금투협 민원, 금감원 대 경찰청 투자사기, 지점 40곳 대 50곳)."
    control: "원문을 브라우저로 대조한 수치만 data/processed에 올리고, 한 통계는 한 기준으로만 쓴다."
  - id: "R-005"
    status: "open"
    risk: "생성형 AI 활용 범위가 '보조'를 넘으면 규정 위반이 된다."
    control: "기획서 본문은 응모자가 직접 쓰고, AI 활용은 06_증빙/AI_활용_기록.md에 기록해 3쪽에 표시한다."
  - id: "R-006"
    status: "open"
    risk: "2차 조사도 웹 검색 한도 소진으로 범위를 다 채우지 못했다. 경쟁사 기능 비교는 대부분 미확인이다."
    control: "'찾지 못함'을 '없다'로 쓰지 않는다. 경쟁사 3곳(KB M-able, 토스, 신한 SOL증권)은 직접 열어 확인한다."

  - id: "R-007"
    status: "open"
    risk: "같은 공모전 주제 02를 겨냥해 후보 가와 겹치는 아이디어('하나 이어받기')가 네이버 블로그(blog.naver.com/psy041127/224489977648)에 공개돼 있다. 남의 글이면 참신성 손해, 응모자 쪽 글이면 기발표작 규정에 걸릴 수 있다."
    control: "글의 주인을 가린다. 응모자 쪽 글이면 주최 측에 사실대로 문의하고 답을 받기 전에는 후보 가를 쓰지 않는다. 남의 글이면 끝까지 읽어 고른 후보와 겹치는지 확인한다."
  - id: "R-008"
    status: "open"
    risk: "후보 마: '하나증권이 금감원이 지적한 10개사에 든다'고 쓸 수 없다(명단 비공개, 요율 불일치). 실제 요율은 이벤트·협의수수료로 표와 다를 수 있고, 회사 수수료 수입이 걸린 민감한 주제다."
    control: "'하나증권 수수료표에도 같은 차등이 있다(홈페이지 확인일 명시)'까지만 쓴다. 수수료표를 캡처하고 계산을 직접 다시 한다."
  - id: "R-009"
    status: "open"
    risk: "화면 시안의 글귀·숫자·구성을 AI 도구가 만들었다. 그대로 첨부하면 'AI는 보조 용도' 규정과 부딪힐 수 있다. 체결 알림 모양과 서비스 값 부과 범위는 확인하지 못한 가정이다."
    control: "응모자가 글귀와 숫자를 직접 고친 뒤 다시 캡처하고, AI 활용 범위에 '화면 시안 제작'을 적는다. 불안하면 주최 측(02-3771-8019)에 AI로 만든 화면 그림 첨부가 되는지 묻는다."

decisions:
  - id: "D-001"
    date: "2026-11-24"
    decision: "대상을 하나은행이 아닌 하나증권 공모전으로 바로잡고, 구현 대신 기획서 3쪽 작성 체계로 하네스를 구성한다."
    rationale: "공식 페이지 확인 결과 주최는 하나증권, 개인 참가, A4 3쪽 기획서이며 코드와 프로토타입은 심사 대상이 아니다."
  - id: "D-002"
    date: "2026-11-24"
    status: "superseded"
    decision: "(1차) 주제 03, 후보 A '리딩방 피해자의 출금 직전 개입'을 권고안으로 둔다."
    rationale: "2차 검증에서 피해 경로 사례를 찾지 못했고 근거 수치의 집계 기준이 불명확해 D-004로 대체."
  - id: "D-004"
    date: "2026-11-24"
    status: "superseded"
    decision: "1순위는 후보 가 '하나증권V에서 막힌 손님을 이미 있는 상담 창구로 맥락과 함께 넘기기'(주제 02 권장, 맞지 않으면 01). 차선은 후보 나 '지정인 알림을 평소와 다른 고액 출금으로 넓히기'(주제 03). 조건부 대안은 후보 마 '영업점 개설 계좌 수수료 차등 통보'(주제 02)."
    rationale: "후보 가는 하나증권 고유의 1차 근거(리뷰, 회사 답변, 기존 창구)가 있는 유일한 후보이고 응모자가 직접 재현할 수 있다. 응모자 확정 전까지는 권고안이며 앱 확인 결과에 따라 바뀐다."
  - id: "D-005"
    date: "2026-11-24"
    decision: "1차 후보 C(의심계좌 임시정지 안내)를 폐기한다."
    rationale: "금융위 원문은 7영업일이고 수취 계좌 대상이며 증권사 적용이 명시되지 않았다."

  - id: "D-006"
    date: "2026-11-25"
    status: "proposed"
    decision: "(3차) 1순위는 후보 마 '지점 개설 계좌 손님이 같은 앱 거래의 수수료 차이를 처음 아는 순간'(주제 02). 차선은 좁힌 후보 가 '로그인 못 하는 손님의 복구 고리'(02 또는 01). 3순위는 고친 후보 나 '기관사칭에 속은 고령 손님의 본인 계좌 경유 반복 출금'(주제 03)."
    rationale: "하나증권 수수료표에서 차등(비대면 0.0141639% 대 영업점 G등급 0.078~0.496%)과 '관리자 지정 시 요율 변경' 주석을 직접 확인했고 금감원 2027년 1분기 시한이 있다. 후보 가는 같은 공모전을 겨냥한 겹치는 블로그 글이 공개돼 있고 기존 창구 전제가 틀렸다. 후보 나는 가족 알림 틀이 네 번 수상했다. 순위는 조사자 판단이며 응모자 확정 전이다."
  - id: "D-007"
    date: "2026-11-25"
    status: "proposed"
    decision: "(4차) 1순위 후보 마(수수료 차등)를 유지한다. 대체 후보로 '유료 주식정보 서비스의 숨은 이용료'(주제 01)를 둔다. 주제 02의 둘째 선택지는 상속 방문 전 서류 준비, 주제 03에서는 하나증권 사칭 연락 진위 확인."
    rationale: "세 기준(당국 지적과 시한, 하나증권 홈페이지 확인, 한 순간)을 모두 채운 새 후보는 유료 서비스 하나뿐이다. 이용자가 업계 손님의 0.23%로 적고 주제 02 적합성은 후보 마가 더 높다. 조사자 판단이며 응모자 확정 전이다."
  - id: "D-008"
    date: "2026-11-25"
    status: "working"
    decision: "응모자가 '유료 주식정보 서비스의 숨은 이용료' 후보로 구체화를 지시했다. 작업안은 docs/03_proposal_outline.md. 주제는 01 권장(공식 예시와 안 맞으면 03). 앱 확인에서 중단 기준에 걸리면 후보 마로 돌아간다."
    rationale: "응모자 선택. 세 기준(당국 지적과 시한, 하나증권 수수료표 확인, 한 순간)을 모두 채운 후보다."
  - id: "D-009"
    date: "2026-11-25"
    status: "working"
    decision: "응모자 지시로 화면 시안과 AI 에이전트 설계를 더한다. 에이전트는 선택지 A·C를 전하는 방식으로 쓰고, 넣는 자리는 체결 직후 알림(주), 수수료·거래내역 화면과 정기 안내 문자(보조)로 한다. 시안은 과거 공모전 디자인 관례(Pretendard, 강조색 하나, 그라데이션·이모지 없음, 해요체, PC 웹 대시보드(2026-11-26 응모자 지시: 왼쪽 메뉴·위 막대·카드 격자·오른쪽 비서 칸, 눌러서 동작하는 뒷단 포함. 하나은행 홈페이지 배치는 따르지 않음), 점선=AI 안내·실선=확정)를 따른다."
    rationale: "응모자 선택. 요강이 프로토타입을 받지 않으므로 첨부 그림으로만 쓴다. 넣는 자리와 권한 범위는 조사자 제안이며 응모자 확정 전이다."

  - id: "D-010"
    date: "2026-11-26"
    status: "working"
    decision: "응모자가 후보를 '퇴사·이직 때 퇴직금(IRP)'(주제 01)으로 바꿨다(D-008을 대체). 서비스 형태는 PC 웹이다. 계획은 docs/04_irp_plan.md."
    rationale: "응모자 선택. IRP 해지 991,533명·14조 5,228억 원(2024년, 전체 IRP 계좌 기준)을 기관 원문으로 확인했고 그 57.6%가 20~30대다."
  - id: "D-011"
    date: "2026-11-26"
    status: "confirmed"
    decision: "검증 조사 뒤 방향을 '절차 대행'에서 '받기 전·깨기 전 다섯 결정 지점 동반'으로 옮긴다. 대상은 퇴직급여 300만 원 초과, 두 번째 이후 이직을 하는 20대 후반~30대. 손해의 축은 세금이 아니라 '필요한 금액과 깨야 하는 금액의 차이'와 '섞였을 때의 16.5%'. 웹의 범위는 눌러서 동작하는 PC 웹 시안과 첨부 그림 3장. 이용료는 받지 않는다."
    rationale: "근속 2~5년의 해지 세금은 7만~17만 6,000원뿐이고(조사자 계산), 근로자가 직접 하는 절차는 둘뿐이며, 비대면 IRP의 직접 수수료는 0에 가깝다. 응모자가 2026-11-26 핵심 아이디어와 방향이 본인의 것임을 확인했다. 세부 값(대상 문구, 화면 글귀, 숫자)은 응모자가 기획서를 쓰며 고친다. 11-27 고객센터 통화와 화면 확인 결과에 따라 바뀔 수 있다."
  - id: "D-012"
    date: "2026-11-26"
    status: "proposed"
    decision: "제출 주제는 01 더 편리한 금융으로 하고 '새로운 손님서비스 발굴'을 앞세운다. 서비스는 앱과 웹 어디서든 쓰는 것으로 적고 PC 화면은 그중 한 모습으로 둔다. 시안은 휴대폰 폭에서도 동작하게 했다."
    rationale: "심사위원 관점 점검(docs/05_judge_review.md)의 권고. 02와 03은 핵심 장면과 맞지 않는다. 주제 선택은 응모자가 정한다."

open_questions:
  - id: "Q-001"
    question: "여럿이 준비한 내용을 1인 명의로 제출해도 되는가?"
